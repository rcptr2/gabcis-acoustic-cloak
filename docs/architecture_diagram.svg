<svg viewBox="0 0 1000 560" xmlns="http://www.w3.org/2000/svg" font-family="Helvetica, Arial, sans-serif">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#2a5d43"/>
    </marker>
    <marker id="arrowOrange" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#c47a1f"/>
    </marker>
  </defs>

  <rect x="0" y="0" width="1000" height="560" fill="#ffffff"/>

  <!-- Lane labels -->
  <text x="20" y="30" font-size="13" font-weight="bold" fill="#2a5d43">BASS (MAIN) SIGNAL PATH</text>
  <text x="20" y="330" font-size="13" font-weight="bold" fill="#c47a1f">KICK (SIDECHAIN) — ANALYSIS ONLY</text>

  <!-- MAIN IN -->
  <rect x="20" y="50" width="110" height="50" rx="8" fill="#eaf5ef" stroke="#2a5d43" stroke-width="1.5"/>
  <text x="75" y="80" font-size="12" text-anchor="middle" fill="#1a3a2a">MAIN IN</text>

  <!-- Lookahead Delay -->
  <rect x="165" y="50" width="120" height="50" rx="8" fill="#eaf5ef" stroke="#2a5d43" stroke-width="1.5"/>
  <text x="225" y="72" font-size="11" text-anchor="middle" fill="#1a3a2a">Lookahead</text>
  <text x="225" y="86" font-size="11" text-anchor="middle" fill="#1a3a2a">Delay (0-20ms)</text>

  <!-- BandIsolator Main -->
  <rect x="320" y="40" width="140" height="70" rx="8" fill="#dff0e6" stroke="#2a5d43" stroke-width="1.5"/>
  <text x="390" y="62" font-size="11" text-anchor="middle" font-weight="bold" fill="#1a3a2a">BandIsolator</text>
  <text x="390" y="77" font-size="10" text-anchor="middle" fill="#1a3a2a">Linkwitz-Riley split</text>
  <text x="390" y="91" font-size="10" text-anchor="middle" fill="#1a3a2a">flat-summing, proven</text>

  <!-- Target Band / Residual outputs -->
  <rect x="500" y="20" width="130" height="40" rx="6" fill="#ffffff" stroke="#2a5d43" stroke-width="1.2"/>
  <text x="565" y="44" font-size="10.5" text-anchor="middle" fill="#1a3a2a">Target Band (Low)</text>
  <rect x="500" y="90" width="130" height="40" rx="6" fill="#ffffff" stroke="#2a5d43" stroke-width="1.2"/>
  <text x="565" y="114" font-size="10.5" text-anchor="middle" fill="#1a3a2a">Residual (High)</text>

  <!-- PhaseRotator box -->
  <rect x="670" y="10" width="230" height="140" rx="8" fill="#dff0e6" stroke="#2a5d43" stroke-width="2"/>
  <text x="785" y="30" font-size="12" text-anchor="middle" font-weight="bold" fill="#1a3a2a">PhaseRotator</text>
  <rect x="685" y="40" width="95" height="36" rx="5" fill="#ffffff" stroke="#2a5d43"/>
  <text x="732" y="62" font-size="9.5" text-anchor="middle" fill="#1a3a2a">AllpassHilbert</text>
  <rect x="790" y="40" width="95" height="36" rx="5" fill="#ffffff" stroke="#2a5d43"/>
  <text x="837" y="62" font-size="9.5" text-anchor="middle" fill="#1a3a2a">rotate by θ → Rlow</text>
  <rect x="685" y="86" width="200" height="36" rx="5" fill="#ffffff" stroke="#c47a1f"/>
  <text x="785" y="108" font-size="9.5" text-anchor="middle" fill="#5a3c10">DummyAllpass (identical) → Ihigh</text>
  <text x="785" y="136" font-size="9" text-anchor="middle" fill="#3a6b52" font-style="italic">Rlow+Ihigh stays flat — LTI linearity</text>

  <!-- Recombine -->
  <rect x="710" y="170" width="150" height="40" rx="6" fill="#ffffff" stroke="#2a5d43" stroke-width="1.2"/>
  <text x="785" y="194" font-size="10.5" text-anchor="middle" fill="#1a3a2a">Recombine + Bypass mix</text>

  <!-- MAIN OUT -->
  <rect x="895" y="170" width="90" height="40" rx="6" fill="#eaf5ef" stroke="#2a5d43" stroke-width="1.5"/>
  <text x="940" y="194" font-size="11" text-anchor="middle" fill="#1a3a2a">MAIN OUT</text>

  <!-- SIDECHAIN IN -->
  <rect x="20" y="350" width="130" height="50" rx="8" fill="#fdf1e2" stroke="#c47a1f" stroke-width="1.5"/>
  <text x="85" y="380" font-size="11.5" text-anchor="middle" fill="#5a3c10">SIDECHAIN IN</text>

  <!-- BandIsolator SC -->
  <rect x="200" y="340" width="140" height="70" rx="8" fill="#fdf1e2" stroke="#c47a1f" stroke-width="1.5"/>
  <text x="270" y="362" font-size="11" text-anchor="middle" font-weight="bold" fill="#5a3c10">BandIsolator</text>
  <text x="270" y="378" font-size="10" text-anchor="middle" fill="#5a3c10">(same target band)</text>
  <text x="270" y="392" font-size="10" text-anchor="middle" fill="#5a3c10">Target Band only</text>

  <!-- Phase Correlation Analyzer -->
  <rect x="400" y="220" width="220" height="150" rx="8" fill="#fff7ea" stroke="#c47a1f" stroke-width="2"/>
  <text x="510" y="242" font-size="12" text-anchor="middle" font-weight="bold" fill="#5a3c10">PhaseCorrelationAnalyzer</text>
  <rect x="415" y="252" width="90" height="34" rx="5" fill="#ffffff" stroke="#c47a1f"/>
  <text x="460" y="272" font-size="9.5" text-anchor="middle" fill="#5a3c10">ResonatorBank</text>
  <rect x="515" y="252" width="90" height="34" rx="5" fill="#ffffff" stroke="#c47a1f"/>
  <text x="560" y="272" font-size="9.5" text-anchor="middle" fill="#5a3c10">z = side·conj(main)</text>
  <text x="510" y="300" font-size="9.5" text-anchor="middle" fill="#5a3c10">broadband envelope → Transient Sensitivity gate</text>
  <text x="510" y="316" font-size="10.5" text-anchor="middle" font-weight="bold" fill="#5a3c10">→ φΔ (phase delta) + correlation</text>
  <text x="510" y="332" font-size="9" text-anchor="middle" fill="#8a6420" font-style="italic">θ = φΔ × Cloak Depth</text>
  <text x="510" y="352" font-size="9" text-anchor="middle" fill="#8a6420">→ Holographic Radar GUI</text>

  <!-- Arrows -->
  <path d="M130,75 H165" stroke="#2a5d43" stroke-width="1.5" fill="none" marker-end="url(#arrow)"/>
  <path d="M285,75 H320" stroke="#2a5d43" stroke-width="1.5" fill="none" marker-end="url(#arrow)"/>
  <path d="M460,60 C480,60 480,40 500,40" stroke="#2a5d43" stroke-width="1.5" fill="none" marker-end="url(#arrow)"/>
  <path d="M460,90 C480,90 480,110 500,110" stroke="#2a5d43" stroke-width="1.5" fill="none" marker-end="url(#arrow)"/>
  <path d="M630,40 C650,40 650,58 670,58" stroke="#2a5d43" stroke-width="1.5" fill="none" marker-end="url(#arrow)"/>
  <path d="M630,110 C650,110 650,104 670,104" stroke="#c47a1f" stroke-width="1.5" fill="none" marker-end="url(#arrowOrange)"/>
  <path d="M785,150 V170" stroke="#2a5d43" stroke-width="1.5" fill="none" marker-end="url(#arrow)"/>
  <path d="M860,190 H895" stroke="#2a5d43" stroke-width="1.5" fill="none" marker-end="url(#arrow)"/>

  <path d="M150,375 H200" stroke="#c47a1f" stroke-width="1.5" fill="none" marker-end="url(#arrowOrange)"/>
  <path d="M270,410 C270,440 420,440 460,370" stroke="#c47a1f" stroke-width="1.5" fill="none" marker-end="url(#arrowOrange)"/>
  <path d="M565,60 C565,150 545,180 520,220" stroke="#2a5d43" stroke-width="1.3" fill="none" stroke-dasharray="4,3" marker-end="url(#arrow)"/>
  <path d="M605,270 C660,270 700,180 685,76" stroke="#8a6420" stroke-width="1.5" fill="none" stroke-dasharray="4,3" marker-end="url(#arrowOrange)"/>

  <text x="500" y="450" font-size="10.5" fill="#555" text-anchor="middle">Dashed lines = analysis-only signal / control data (not audio). Solid = audio signal path.</text>
  <text x="500" y="470" font-size="10.5" fill="#555" text-anchor="middle">At Cloak Depth 0%% (θ=0), Rlow = Ilow exactly by construction — no audio change regardless of the network's own response.</text>
</svg>
